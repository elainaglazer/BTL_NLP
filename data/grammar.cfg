# ========================================================
# EXTENDED CONTEXT-FREE GRAMMAR FOR COURSE ASSISTANT (V2)
# ========================================================

S -> Q_COURSE | Q_TOPIC | Q_SCHEDULE | Q_ASSIGN | Q_DEADLINE | Q_RESOURCE | Q_RULE | Q_CONTEXT

# 1. Hỏi thông tin chung môn học (GET_COURSE_INFO)
Q_COURSE -> COURSE_NP "có" "bao" "nhiêu" "tín" "chỉ" OPT_QMARK
Q_COURSE -> "số" "tín" "chỉ" "của" COURSE_NP "là" "bao" "nhiêu" OPT_QMARK
Q_COURSE -> "thông" "tin" "chung" "của" COURSE_NP OPT_QMARK
Q_COURSE -> "mã" "môn" "học" "của" COURSE_NP "là" "gì" OPT_QMARK
Q_COURSE -> "giảng" "viên" "phụ" "trách" COURSE_NP "là" "ai" OPT_QMARK
Q_COURSE -> "mục" "tiêu" "của" COURSE_NP "là" "gì" OPT_QMARK

# 2. Hỏi nội dung / chủ đề (GET_TOPIC)
Q_TOPIC -> TIME_NP "học" "những" TOPIC_WORD "gì" OPT_QMARK
Q_TOPIC -> TIME_NP "học" "về" TOPIC_WORD "gì" OPT_QMARK
Q_TOPIC -> "nội" "dung" "học" "của" TIME_NP "là" "gì" OPT_QMARK
Q_TOPIC -> TOPIC_NP "nằm" "ở" "tuần" "nào" OPT_QMARK
Q_TOPIC -> "tuần" "nào" "học" "về" TOPIC_NP OPT_QMARK
Q_TOPIC -> "nội" "dung" "của" TOPIC_NP "là" "gì" OPT_QMARK
Q_TOPIC -> CHAPTER_NP "nói" "về" "chủ" "đề" "gì" OPT_QMARK

# 3. Hỏi lịch học (GET_SCHEDULE)
Q_SCHEDULE -> "lịch" "học" "của" COURSE_NP "như" "thế" "nào" OPT_QMARK
Q_SCHEDULE -> "kế" "hoạch" "giảng" "dạy" COURSE_NP "ra" "sao" OPT_QMARK
Q_SCHEDULE -> "khi" "nào" "bắt" "đầu" "học" TOPIC_NP OPT_QMARK
Q_SCHEDULE -> TIME_NP "có" "lịch" "học" "không" OPT_QMARK

# 4. Hỏi thông tin bài tập (GET_ASSIGNMENT)
Q_ASSIGN -> ASSIGN_NP "có" "những" "yêu" "cầu" "gì" OPT_QMARK
Q_ASSIGN -> "yêu" "cầu" "của" ASSIGN_NP "là" "gì" OPT_QMARK
Q_ASSIGN -> "tôi" "cần" "hoàn" "thành" "những" "bài" "tập" "nào" OPT_QMARK
Q_ASSIGN -> "nội" "dung" "của" ASSIGN_NP "là" "gì" OPT_QMARK
Q_ASSIGN -> "nhóm" ASSIGN_NP "gồm" "bao" "nhiêu" "người" OPT_QMARK
Q_ASSIGN -> "cách" "nộp" ASSIGN_NP "như" "thế" "nào" OPT_QMARK

# 5. Hỏi thời hạn / Deadline (GET_DEADLINE)
Q_DEADLINE -> "deadline" "của" ASSIGN_NP "là" "khi" "nào" OPT_QMARK
Q_DEADLINE -> "deadline" ASSIGN_NP "là" "ngày" "nào" OPT_QMARK
Q_DEADLINE -> "hạn" "nộp" ASSIGN_NP "là" "khi" "nào" OPT_QMARK
Q_DEADLINE -> "khi" "nào" "phải" "nộp" ASSIGN_NP OPT_QMARK

# 6. Hỏi tài liệu tham khảo (GET_RESOURCE)
Q_RESOURCE -> "tài" "liệu" "nào" "nói" "về" TOPIC_NP OPT_QMARK
Q_RESOURCE -> "giáo" "trình" "của" COURSE_NP "là" "gì" OPT_QMARK
Q_RESOURCE -> "tài" "liệu" "tham" "khảo" "của" COURSE_NP "gồm" "những" "gì" OPT_QMARK
Q_RESOURCE -> "tìm" "tài" "liệu" "về" TOPIC_NP "ở" "đâu" OPT_QMARK

# 7. Hỏi quy định môn học (GET_RULE)
Q_RULE -> ASSIGN_NP "có" "được" "sử" "dụng" TOOL_NP "không" OPT_QMARK
Q_RULE -> "có" "được" "dùng" TOOL_NP "trong" ASSIGN_NP "không" OPT_QMARK
Q_RULE -> "quy" "định" "về" RULE_TOPIC "như" "thế" "nào" OPT_QMARK
Q_RULE -> "nộp" "trễ" ASSIGN_NP "có" "bị" "trừ" "điểm" "không" OPT_QMARK

# 8. Câu hỏi ngữ cảnh cục bộ (LOCAL_CONTEXT)
Q_CONTEXT -> "tài" "liệu" "của" REF_NP "ở" "đâu" OPT_QMARK
Q_CONTEXT -> "deadline" "của" REF_NP "là" "khi" "nào" OPT_QMARK
Q_CONTEXT -> "chi" "tiết" "về" REF_NP "như" "thế" "nào" OPT_QMARK
Q_CONTEXT -> "nó" "có" "yêu" "cầu" "gì" OPT_QMARK

# --- CÁC CỤM DANH TỪ & TỪ VỰNG ---
COURSE_NP -> "môn" "nlp" | "môn" "xử" "lý" "ngôn" "ngữ" "tự" "nhiên" | "co3085" | "môn" "học" "này"
TIME_NP -> "tuần" "1" | "tuần" "2" | "tuần" "3" | "tuần" "4" | "tuần" "5" | "tuần" "6" | "tuần" "7" | "tuần" "8" | "tuần" "9" | "tuần" "10" | "tuần" "11" | "tuần" "12" | "tuần" "13" | "tuần" "14" | "tuần" "15"
CHAPTER_NP -> "chương" "1" | "chương" "2" | "chương" "3" | "chương" "4" | "chương" "5" | "chương" "6" | "chương" "7" | "chương" "8" | "chương" "9" | "chương" "10" | "chương" "11" | "chương" "12"
TOPIC_WORD -> "nội" "dung" | "chủ" "đề" | "bài" "học" | "kiến" "thức"
TOPIC_NP -> "cfg" | "parsing" | "cfg" "và" "parsing" | "ngữ" "nghĩa" | "rag" | "llm" | "mô" "hình" "ngôn" "ngữ" | "pos" "tagging" | "ner" | "word" "embedding" | "transformer"
ASSIGN_NP -> "bài" "tập" "lớn" | "btl" | "project" | "bài" "tập" "1" | "bài" "tập" "2" | "bài" "tập"
TOOL_NP -> "công" "cụ" "ai" | "ai" | "chatgpt" | "llm"
RULE_TOPIC -> "điểm" "danh" | "thi" "cuối" "kỳ" | "trung" "thực" "học" "thuật" | "nộp" "bài" | "docker"
REF_NP -> "phần" "này" | "nội" "dung" "đó" | "bài" "này" | "chương" "đó"
OPT_QMARK -> "?" | ""