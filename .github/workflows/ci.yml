name: TV4 week 1 integration
on: [push, pull_request, workflow_dispatch]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: OUTPUT_DIR="$RUNNER_TEMP/week1-output" python -m src.main run-all
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nlp-course-assistant .
      - name: Verify grading mounts and explicit pending status
        run: |
          mkdir -p out
          docker run --rm -v "$PWD/input:/nlp/input" -v "$PWD/out:/nlp/output" nlp-course-assistant
          test -s out/grammar.txt
          test -s out/samples.txt
          test -s out/parse-results.txt
          grep -q PENDING_INTEGRATION out/integration-trace.jsonl
